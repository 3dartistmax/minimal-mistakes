---
layout: default
---
<div id="main" role="main">
  <article class="page">
    <div class="page__inner-wrap">
      <header>
        <h1 class="page__title">{{ page.title }}</h1>
        {% if page.description %}<p class="archive__subtitle">{{ page.description }}</p>{% endif %}
      </header>
      {% if page.image %}
      <p><img class="artwork-detail-image" src="{{ page.image | relative_url }}" alt="{{ page.title }}"></p>
      {% endif %}
      <div class="page__content">{{ content }}</div>
      <p><a href="{{ '/artworks/' | relative_url }}">← कलासंग्रहमा फर्कनुहोस्</a></p>
    </div>
  </article>
</div>
